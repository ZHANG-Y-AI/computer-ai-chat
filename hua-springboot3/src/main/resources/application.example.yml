# Project configuration
hua:
  name: hua
  version: 1.0.0
  copyrightYear: 2025
  profile: ${HUA_UPLOAD_PATH:./uploads}
  addressEnabled: false
  captchaType: math

server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

logging:
  level:
    com.hua: info
    org.springframework: warn

user:
  password: ${DEFAULT_USER_PASSWORD:change-me}
  maxRetryCount: 5
  lockTime: 10

spring:
  messages:
    basename: i18n/messages
  profiles:
    active: druid
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: true

token:
  header: Authorization
  secret: ${TOKEN_SECRET:change-this-token-secret}
  expireTime: 300

mybatis:
  typeAliasesPackage: com.hua.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml
  configuration:
    mapUnderscoreToCamelCase: true

pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

xss:
  enabled: true
  excludes: /system/notice,/kb/**
  urlPatterns: /system/*,/monitor/*,/tool/*

langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: ${DASHSCOPE_CHAT_MODEL:qwen-max}
        api-key: ${DASHSCOPE_API_KEY:}
      embedding-model:
        model-name: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
        api-key: ${DASHSCOPE_API_KEY:}
      streaming-chat-model:
        model-name: ${DASHSCOPE_STREAM_MODEL:qwen-max}
        api-key: ${DASHSCOPE_API_KEY:}
